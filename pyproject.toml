[project]
name = "bbtext"
version = "0.1.0"
description = "BBText - B站视频音频转字幕工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "sherpa-onnx>=1.12.34",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
]

[project.scripts]
bbt = "bbt.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
